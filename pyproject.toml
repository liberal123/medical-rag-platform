[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-rag-platform"
version = "0.1.0"
description = "Medical document retrieval, evidence citations and vLLM question answering"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<0.116", "uvicorn>=0.34,<0.36", "httpx>=0.27,<0.29", "pydantic>=2.10,<3"]

[tool.setuptools.packages.find]
where = ["src"]
